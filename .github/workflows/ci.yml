name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: search_eval
          POSTGRES_PASSWORD: search_eval
          POSTGRES_DB: search_eval_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U search_eval"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URI: postgresql+psycopg2://search_eval:search_eval@localhost:5432/search_eval_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[dev,oracle]'
      - name: Migrations apply cleanly to an empty database
        run: alembic upgrade head
        env:
          SQLALCHEMY_DATABASE_URI: ${{ env.TEST_DATABASE_URI }}
      - name: Tests
        run: pytest
      - name: Migrations match the models
        run: alembic check
        env:
          SQLALCHEMY_DATABASE_URI: ${{ env.TEST_DATABASE_URI }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types and build
        run: npm run build
      - name: Tests
        run: npm test
