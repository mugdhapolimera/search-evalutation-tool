[project]
name = "search_eval"
version = "0.1.0"
description = "Evaluate changes to SciX search results: compare runs, rate and rank records, measure them."
authors = [{ name = "Mugdha Polimera" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
]

# adsmutils pins SQLAlchemy below 2.0, so this service runs SQLAlchemy 1.4 and
# writes every query in the 2.0 style (select(), text()). Moving to 2.x is a pin
# bump once adsmutils allows it.
dependencies = [
    "adsmutils @ git+https://github.com/adsabs/ADSMicroserviceUtils.git@v2.0.0",
    "alembic==1.19.1",
    "Jinja2==3.1.6",
    "markupsafe==3.0.3",
    "werkzeug==2.3.8",
    "nh3==0.3.1",
    "psycopg2-binary==2.9.12",
    "requests>=2.31,<3",
]

[project.urls]
Source = "https://github.com/adsabs/search-evalutation-tool"

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "flake8==7.5.0",
    "isort==9.0.2",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.17.5",
]
# The oracle the scoring tests check against. Not a runtime dependency: the
# scoring module is stdlib only, so the image carries no scipy or numpy.
oracle = [
    "ir_measures==0.4.3",
]

[build-system]
requires = ["setuptools>=62.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["search_eval*"]
exclude = ["search_eval.tests*"]

[tool.setuptools.package-data]
search_eval = ["frontend_dist/*", "frontend_dist/assets/*"]

[tool.pytest.ini_options]
addopts = "-v -Wdefault --cov=search_eval --cov-report=term-missing"
cache_dir = ".tmp/"
testpaths = ["search_eval/tests"]
pythonpath = ["."]

[tool.coverage.run]
data_file = ".tmp/.coverage"
omit = ["search_eval/tests/*"]

[tool.coverage.report]
skip_empty = true

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["search_eval"]

[tool.black]
line-length = 99
target-version = ["py312"]
